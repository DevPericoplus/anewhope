<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" role="img" aria-labelledby="t">
  <title id="t">Inefficient hairpin routing</title>
  <defs>
