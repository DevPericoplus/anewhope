  </g><text x="420" y="155" text-anchor="middle" fill="#5ec8ff" font-family="ui-monospace, Menlo, monospace" font-size="11">HTTPS relay</text><line x1="160" y1="180" x2="400" y2="100" stroke="#5ec8ff" stroke-width="2.2" marker-end="url(#arrB)"/><line x1="440" y1="100" x2="680" y2="180" stroke="#5ec8ff" stroke-width="2.2" marker-end="url(#arrB)"/><text x="420" y="370" text-anchor="middle" fill="#8fd48f" font-family="ui-monospace, Menlo, monospace" font-size="11">Relay cannot decrypt — private key never leaves the node</text></svg>
