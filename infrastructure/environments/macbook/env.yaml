# Modo de almacenamiento de datos
# - mock: Solo archivos JSON (para pruebas sin base de datos)
# - mock_and_db: JSON + sincronización con MariaDB (desarrollo híbrido)
# - db_only: Solo MariaDB (recomendado para desarrollo normal y producción)
storage_mode: db_only

# Sincronización DB → JSON (solo en modo db_only y mock_and_db)
# "1" = habilitado, "0" = deshabilitado
# Copia periódicamente los datos de MariaDB a los JSON para tener backup
active_sync_db_jsons: "1"

# Intervalo de sincronización en segundos (5 minutos)
sync_database_interval_seconds: "300"

# ============================================================================
# Domain configuration (macbook - desarrollo local)
# ============================================================================
# public_name: Dominio público que el usuario escribe en el navegador
# private_name: Dominio interno para comunicación entre servicios
# public_ip: IP pública del servidor (necesaria para acceso desde otros dispositivos en la red)
#            Esta IP se usa para servicios que requieren acceso directo desde navegadores externos
#            como fmanagement (subida/descarga de archivos)
# En macbook, el navegador accede directamente a localhost
public_name: tfmmyllm.ai
private_name: localhost
public_ip: 192.168.0.39

# ============================================================================
# Applications in servers (macbook - desarrollo local)
# ============================================================================
# En macbook todas las aplicaciones corren en localhost con puertos distintos.
# Regla de puertos: 8000 + primer dígito del nombre de la carpeta de la app.

# Backend Core (3_backend) - puerto 8003
backend_core_host: localhost
backend_core_port: "8003"

# Backend IA / Trainer (4_trainer) - puerto 8004
trainer_host: localhost
trainer_port: "8004"

# Web Frontend (5_web_frontend) - puerto 8005
frontend_host: localhost
frontend_port: "8005"

# Web Backoffice (6_web_backoffice) - puerto 8006
backoffice_host: localhost
backoffice_port: "8006"

# Middleware (7_service_frontend) - puerto 8007
middleware_host: localhost
middleware_port: "8007"

# Broker (8_service_backend) - puerto 8008
broker_host: localhost
broker_port: "8008"

# Fmanagement (API Go de ficheros) - puerto 1666
fmanagement_host: localhost
fmanagement_port: "1666"

# ============================================================================
# URLs de servicios internos (construidas a partir de host:port)
# ============================================================================
# IMPORTANTE: fmanagement_base_url debe usar public_ip para permitir acceso desde
# navegadores en otros dispositivos de la red (Windows, tablets, etc.)
# Esto es necesario porque el navegador ejecuta JavaScript que hace peticiones
# directas a fmanagement para subir/descargar archivos.
broker_backend_base_url: http://localhost:8008
core_backend_base_url: http://localhost:8003
middleware_base_url: http://localhost:8007
fmanagement_base_url: http://192.168.0.39:1666
trainer_base_url: http://localhost:8004

# ============================================================================
# Redis (sesión compartida entre frontend y backoffice)
# ============================================================================
redis_host: localhost
redis_port: "6379"
redis_db: "0"
redis_token_expiration: "28800"
redis_lock_expiration: "30000"
redis_lock_warning_threshold: "1000"

# ============================================================================
# Rutas de almacenamiento para fmanagement
# ============================================================================
# Ruta base que Backend Core pasa a fmanagement para operaciones de archivos
fmanagement_base_path: ~/data/anewhope/files/backend_server/external

# Rutas de almacenamiento (referencia)
backend_core_base_storage: ~/data/anewhope/files/backend_server/external
backend_core_internal_storage: ~/data/anewhope/files/backend_server/internal
backend_ia_base_storage: ~/data/anewhope/files/trainer_server/external
# NOTA: backend_ia_internal_storage apunta al backend (no trainer) porque:
# - Trainer genera ZIPs en ~/data/anewhope/files/trainer_server/internal/
# - Script rsync los copia a ~/data/anewhope/files/backend_server/internal/
# - fmanagement y endpoint /models/list los sirven desde backend_server
backend_ia_internal_storage: ~/data/anewhope/files/backend_server/internal

# ============================================================================
# ChromaDB (base de datos vectorial - servidor gestionado por trainer)
# ============================================================================
# ChromaDB corre como servidor HTTP autónomo, gestionado por el trainer (4_trainer).
# El trainer arranca el servidor en su lifespan y se conecta como cliente.
chroma_host: localhost
chroma_port: "8100"
chroma_persist_directory: ~/data/anewhope/files/trainer_server/persistence/chroma
chroma_collection_name: myllm_embeddings
# Telemetría anónima (true/false) - desactivar en producción
chroma_anonymized_telemetry: "false"
# Logging nivel del servidor ChromaDB (DEBUG, INFO, WARNING, ERROR)
chroma_log_level: INFO

# ============================================================================
# Configuración de Ollama para entrenamiento RAG
# ============================================================================
# Modelo base para generación RAG (debe estar instalado en Ollama)
ollama_rag_base_model: "deepseek-r1:8b"

# ============================================================================
# Configuración de modo de entrenamiento
# ============================================================================
# Modo de entrenamiento del modelo:
#   - simulation: Solo RAG (fases 1-5), sin fine-tuning, genera Modelfile tradicional
#                 Tiempo: 1-3 minutos, 16 subfases
#                 Ideal para: desarrollo en equipos sin GPU (macbook Intel i7 16GB)
#
#   - test: RAG + Fine-tuning LoRA reducido (fases 1-9)
#           Dataset: 100 ejemplos, 1-2 epochs, rank=8
#           Tiempo: ~30 minutos, 36 subfases
#           Ideal para: validación en entorno dev con GPU
#
#   - production: RAG + Fine-tuning LoRA completo (fases 1-9)
#                 Dataset: completo, 3-5 epochs, rank=16-32
#                 Tiempo: 1-4 horas, 36 subfases
#                 Ideal para: producción en pre/pro con GPU NVIDIA CUDA
#
# IMPORTANTE: El modo se lee de .envglobal (training_mode), esta variable
# solo sirve como documentación del valor esperado para este entorno.
training_mode: simulation

# ============================================================================
# Configuración de transferencia de versiones (macbook usa local)
# ============================================================================
transfer_mode: local
# SSH no requerido en modo local, pero incluido para referencia
trainer_ssh_host: localhost
trainer_ssh_user: rsync_user
trainer_ssh_key_path: ~/.ssh/rsync_key
trainer_ssh_port: "22"
