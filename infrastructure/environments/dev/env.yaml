# Modo de almacenamiento de datos
# - mock: Solo archivos JSON (para pruebas sin base de datos)
# - mock_and_db: JSON + sincronización con MariaDB (desarrollo híbrido)
# - db_only: Solo MariaDB (recomendado para desarrollo normal y producción)
storage_mode: db_only

# Sincronización DB → JSON (solo en modo db_only y mock_and_db)
# "1" = habilitado, "0" = deshabilitado (DEBE ser "0" en producción)
active_sync_db_jsons: "1"

# Intervalo de sincronización en segundos (5 minutos)
sync_database_interval_seconds: "300"

# ============================================================================
# Domain configuration (dev - desarrollo en servidor)
# ============================================================================
# public_name: Dominio público que el usuario escribe en el navegador
# private_name: Dominio interno para comunicación entre servicios
# En dev: navegador → anewhope.house.local → nginx → frontend.house.loc
public_name: house.loc
private_name: anewhope.house.local

# ============================================================================
# Applications in servers (dev - desarrollo en servidor)
# ============================================================================
# Dominio: house.loc
# Servidores: frontend.house.loc, backend.house.loc, trainer.house.loc
# Regla de puertos: 8000 + primer dígito del nombre de la carpeta de la app.

# Backend Core (3_backend) - en servidor backend - puerto 8003
backend_core_host: backend.house.loc
backend_core_port: "8003"

# Backend IA / Trainer (4_trainer) - en servidor trainer - puerto 8004
trainer_host: trainer.house.loc
trainer_port: "8004"

# Web Frontend (5_web_frontend) - en servidor frontend - puerto 8005
frontend_host: frontend.house.loc
frontend_port: "8005"

# Web Backoffice (6_web_backoffice) - en servidor frontend - puerto 8006
backoffice_host: frontend.house.loc
backoffice_port: "8006"

# Middleware (7_service_frontend) - en servidor frontend - puerto 8007
middleware_host: frontend.house.loc
middleware_port: "8007"

# Broker (8_service_backend) - en servidor backend - puerto 8008
broker_host: backend.house.loc
broker_port: "8008"

# Fmanagement (API Go de ficheros) - en servidor backend - puerto 1666
fmanagement_host: backend.house.loc
fmanagement_port: "1666"

# ============================================================================
# URLs públicas de Reflex (api_url compilado en el JavaScript del frontend)
# ============================================================================
# Estas URLs son las que el NAVEGADOR del usuario usa para conectar WebSocket/API.
# En dev: el navegador accede via Nginx HTTPS, que redirige a granian.
frontend_api_url: https://myllm.house.loc
backoffice_api_url: https://myllm.house.loc:8443

# ============================================================================
# URLs de servicios internos (construidas a partir de host:port)
# ============================================================================
broker_backend_base_url: http://backend.house.loc:8008
core_backend_base_url: http://backend.house.loc:8003
middleware_base_url: http://frontend.house.loc:8007
fmanagement_base_url: http://backend.house.loc:1666
fmanagement_base_path: /data/external
trainer_base_url: http://trainer.house.loc:8004

# ============================================================================
# Redis (sesión compartida entre frontend y backoffice)
# ============================================================================
# Redis corre en el servidor frontend
redis_host: frontend.house.loc
redis_port: "6379"
redis_db: "0"
redis_token_expiration: "28800"
redis_lock_expiration: "10000"
redis_lock_warning_threshold: "1000"

# ============================================================================
# MariaDB (base de datos relacional - servidor backend)
# ============================================================================
mariadb_host: backend.house.loc
mariadb_port: "3306"
mariadb_projects_database: myllm_projects_db
laim_core_database: laim_core_db

# ============================================================================
# LAIM Web — Cap CAPTCHA (registro público, auto-hospedado)
# ============================================================================
# Endpoint público del servidor Cap (incluye site key en la URL).
# En dev: Cap corre en Docker, nginx lo expone bajo /cap/
# Secret en protected_values.py (laim_cap_secret).
laim_cap_api_endpoint: "https://laim.house.loc/cap/<CAP_SITE_KEY>/"

# ============================================================================
# Rutas de almacenamiento para fmanagement
# ============================================================================
backend_core_base_storage: /data/external
backend_core_internal_storage: /data/internal
backend_core_reports_storage: /data/internal/reports
backend_core_models_storage: /data/internal/models
backend_ia_base_storage: /data/external
backend_ia_internal_storage: /data/internal
backend_ia_reports_storage: /data/internal/reports
backend_ia_models_storage: /data/internal/models
backend_core_base_url: http://backend.house.loc:8003

# ============================================================================
# ChromaDB (base de datos vectorial - servidor gestionado por trainer)
# ============================================================================
# ChromaDB corre como servidor HTTP autónomo en el servidor trainer.
# El trainer arranca el servidor en su lifespan y se conecta como cliente.
chroma_host: trainer.house.loc
chroma_port: "8100"
chroma_persist_directory: /data/persistence/chroma
chroma_collection_name: myllm_embeddings
chroma_anonymized_telemetry: "false"
chroma_log_level: INFO

# ============================================================================
# Configuración de Ollama para entrenamiento RAG
# ============================================================================
ollama_rag_base_model: "deepseek-r1:8b"

# ============================================================================
# Configuración de modo de entrenamiento
# ============================================================================
# ============================================================================
# Modo de ejecución de Reflex (dev/prod)
# ============================================================================
# "dev"  = Vite dev server (renderizado idéntico al macbook, sin build estático)
# "prod" = Build estático con sirv (optimizado para producción)
# En dev usamos "dev" para garantizar paridad visual con macbook
reflex_env_mode: dev

# Modo recomendado para dev: test (RAG + LoRA reducido con GPU)
training_mode: test

# ============================================================================
# Configuración de transferencia de versiones (dev usa rsync remoto)
# ============================================================================
transfer_mode: remote
trainer_ssh_host: trainer.house.loc
trainer_ssh_user: rsync_user
trainer_ssh_key_path: /opt/anewhope/keys/rsync_key
trainer_ssh_port: "22"

# ============================================================================
# LAIM Web — Foro
# ============================================================================
laim_forum_active: "true"
laim_forum_poll_interval_seconds: "3"
laim_forum_storage_path: /data/laim/forum
laim_site_storage_path: /data/laim/site
laim_forum_max_strikes_url: "3"
laim_forum_max_attachments_per_message: "3"
laim_forum_max_image_bytes: "5242880"
