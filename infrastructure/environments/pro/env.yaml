# Modo de almacenamiento de datos - OBLIGATORIO db_only en producción
# CRÍTICO: En producción NUNCA usar mock ni mock_and_db
storage_mode: db_only

# Sincronización DB → JSON - OBLIGATORIO "0" en producción
# CRÍTICO: No sincronizar a JSON en producción por seguridad
active_sync_db_jsons: "0"

# URLs de servicios internos
broker_backend_base_url: http://localhost:8008
core_backend_base_url: http://localhost:8003
middleware_base_url: http://localhost:8007
fmanagement_base_url: http://localhost:1666

# Intervalo de sincronización (no aplica con active_sync_db_jsons="0")
sync_database_interval_seconds: "0"

# Redis (sesión compartida)
redis_host: localhost
redis_port: "6379"
redis_db: "0"
redis_token_expiration: "3600"
redis_lock_expiration: "10000"
redis_lock_warning_threshold: "1000"

# Rutas de almacenamiento para fmanagement
backend_core_base_storage: /data/files/external
backend_ia_base_storage: /data/files/trainer

# Configuración de transferencia de versiones (pro usa rsync remoto)
transfer_mode: remote
trainer_ssh_host: trainer-pro.internal
trainer_ssh_user: rsync_user
trainer_ssh_key_path: /opt/anewhope/keys/rsync_key
trainer_ssh_port: "22"
