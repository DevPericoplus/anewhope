# Modo de almacenamiento de datos - OBLIGATORIO db_only en producción
# CRÍTICO: En producción NUNCA usar mock ni mock_and_db
storage_mode: db_only

# Sincronización DB → JSON - OBLIGATORIO "0" en producción
# CRÍTICO: No sincronizar a JSON en producción por seguridad
active_sync_db_jsons: "0"

# Intervalo de sincronización (no aplica con active_sync_db_jsons="0")
sync_database_interval_seconds: "0"

# ============================================================================
# Domain configuration (pro - producción AWS)
# ============================================================================
# public_name: Dominio público que el usuario escribe en el navegador
# private_name: Dominio interno para comunicación entre servicios
# En pro: navegador → www.getmyllm.com → nginx → frontend.anewhope.aws
public_name: getmyllm.com
private_name: anewhope.aws

# ============================================================================
# Applications in servers (pro - producción AWS)
# ============================================================================
# Dominio público: getmyllm.com (solo nginx frontend)
# Dominio interno: anewhope.aws (comunicación entre servicios)
# Servidores: frontend.anewhope.aws, backend.anewhope.aws, trainer.anewhope.aws
# Regla de puertos: 8000 + primer dígito del nombre de la carpeta de la app.

# Backend Core (3_backend) - en servidor backend - puerto 8003
backend_core_host: backend.anewhope.aws
backend_core_port: "8003"

# Backend IA / Trainer (4_trainer) - en servidor trainer - puerto 8004
trainer_host: trainer.anewhope.aws
trainer_port: "8004"

# Web Frontend (5_web_frontend) - en servidor frontend - puerto 8005
frontend_host: frontend.anewhope.aws
frontend_port: "8005"

# Web Backoffice (6_web_backoffice) - en servidor frontend - puerto 8006
backoffice_host: frontend.anewhope.aws
backoffice_port: "8006"

# Middleware (7_service_frontend) - en servidor frontend - puerto 8007
middleware_host: frontend.anewhope.aws
middleware_port: "8007"

# Broker (8_service_backend) - en servidor backend - puerto 8008
broker_host: backend.anewhope.aws
broker_port: "8008"

# Fmanagement (API Go de ficheros) - en servidor backend - puerto 1666
fmanagement_host: backend.anewhope.aws
fmanagement_port: "1666"

# ============================================================================
# URLs públicas de Reflex (api_url compilado en el JavaScript del frontend)
# ============================================================================
# Estas URLs son las que el NAVEGADOR del usuario usa para conectar WebSocket/API.
# En pro: el navegador accede via Nginx HTTPS con dominio público.
frontend_api_url: https://getmyllm.com
backoffice_api_url: https://getmyllm.com:8443

# ============================================================================
# URLs de servicios internos (construidas a partir de host:port)
# ============================================================================
broker_backend_base_url: http://backend.anewhope.aws:8008
core_backend_base_url: http://backend.anewhope.aws:8003
middleware_base_url: http://frontend.anewhope.aws:8007
fmanagement_base_url: http://backend.anewhope.aws:1666
fmanagement_base_path: /data/external
trainer_base_url: http://trainer.anewhope.aws:8004

# ============================================================================
# Redis (sesión compartida entre frontend y backoffice)
# ============================================================================
# Redis corre en el servidor frontend
redis_host: frontend.anewhope.aws
redis_port: "6379"
redis_db: "0"
redis_token_expiration: "28800"
redis_lock_expiration: "10000"
redis_lock_warning_threshold: "1000"

# ============================================================================
# Rutas de almacenamiento para fmanagement
# ============================================================================
backend_core_base_storage: /data/external
backend_core_internal_storage: /data/internal
backend_core_reports_storage: /data/internal/reports
backend_core_models_storage: /data/internal/models
backend_ia_base_storage: /data/external
backend_ia_internal_storage: /data/internal
backend_ia_reports_storage: /data/internal/reports
backend_ia_models_storage: /data/internal/models
backend_core_base_url: http://backend.anewhope.aws:8003

# ============================================================================
# ChromaDB (base de datos vectorial - servidor gestionado por trainer)
# ============================================================================
# ChromaDB corre como servidor HTTP autónomo en el servidor trainer.
# El trainer arranca el servidor en su lifespan y se conecta como cliente.
chroma_host: trainer.anewhope.aws
chroma_port: "8100"
chroma_persist_directory: /data/persistence/chroma
chroma_collection_name: myllm_embeddings
chroma_anonymized_telemetry: "false"
chroma_log_level: ERROR

# ============================================================================
# Configuración de Ollama para entrenamiento RAG
# ============================================================================
ollama_rag_base_model: "deepseek-r1:8b"

# ============================================================================
# Configuración de modo de entrenamiento
# ============================================================================
# ============================================================================
# Modo de ejecución de Reflex (dev/prod)
# ============================================================================
# "dev"  = Vite dev server (desarrollo)
# "prod" = Build estático con sirv (optimizado para producción)
# En pro SIEMPRE usar "prod" para rendimiento y seguridad
reflex_env_mode: prod

# Modo recomendado para pro: production (RAG + LoRA completo con GPU CUDA)
training_mode: production

# ============================================================================
# Configuración de transferencia de versiones (pro usa rsync remoto)
# ============================================================================
transfer_mode: remote
trainer_ssh_host: trainer.anewhope.aws
trainer_ssh_user: rsync_user
trainer_ssh_key_path: /opt/anewhope/keys/rsync_key
trainer_ssh_port: "22"

# ============================================================================
# LAIM Web — Foro
# ============================================================================
laim_forum_active: "true"
laim_forum_poll_interval_seconds: "3"
laim_forum_storage_path: /data/laim/forum
laim_forum_max_strikes_url: "3"
laim_forum_max_attachments_per_message: "3"
laim_forum_max_image_bytes: "5242880"
