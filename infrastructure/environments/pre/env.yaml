# Modo de almacenamiento de datos
# - mock: Solo archivos JSON (para pruebas sin base de datos)
# - mock_and_db: JSON + sincronización con MariaDB (desarrollo híbrido)
# - db_only: Solo MariaDB (recomendado para desarrollo normal y producción)
storage_mode: db_only

# Sincronización DB → JSON (solo en modo db_only y mock_and_db)
# "1" = habilitado, "0" = deshabilitado (DEBE ser "0" en producción)
# En preproducción podemos mantenerlo habilitado para debugging
active_sync_db_jsons: "1"

# URLs de servicios internos
broker_backend_base_url: http://localhost:8008
core_backend_base_url: http://localhost:8003
middleware_base_url: http://localhost:8007
fmanagement_base_url: http://localhost:1666

# Intervalo de sincronización en segundos (5 minutos)
sync_database_interval_seconds: "300"

# Redis (sesión compartida)
redis_host: localhost
redis_port: "6379"
redis_db: "0"
redis_token_expiration: "3600"
redis_lock_expiration: "10000"
redis_lock_warning_threshold: "1000"

# Rutas de almacenamiento para fmanagement
backend_core_base_storage: /data/files/external
backend_ia_base_storage: /data/files/trainer

# Configuración de transferencia de versiones (pre usa rsync remoto)
transfer_mode: remote
trainer_ssh_host: trainer-pre.internal
trainer_ssh_user: rsync_user
trainer_ssh_key_path: /opt/anewhope/keys/rsync_key
trainer_ssh_port: "22"
