worker_processes  1;
events {
    worker_connections  1024;
}
http {
    include       /usr/local/etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    # FIX: Optimizaciones para evitar cortes en ficheros grandes JS/CSS
    # Aumentamos buffers para cabeceras grandes y descargas
    proxy_buffer_size   128k; 
    proxy_buffers   4 256k; 
    proxy_busy_buffers_size   256k;
    client_max_body_size 50M;
    # Configuración SSL recomendada
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    # Servidor HTTP (puerto 8080) - Redirección a HTTPS
    server {
        listen 0.0.0.0:8080;
        server_name tfmmyllm.ai *.tfmmyllm.ai 192.168.0.101 192.168.0.39 localhost;
        # Redirigir todo el tráfico HTTP a HTTPS
        return 301 https://$host$request_uri;
    }
    # Servidor HTTPS (puerto 443)
    server {
        listen 0.0.0.0:443 ssl;
        server_name tfmmyllm.ai *.tfmmyllm.ai 192.168.0.101 192.168.0.39 localhost;
        # Certificados SSL
        # Nota: Estas rutas deben coincidir con tu estructura local en Mac
        ssl_certificate /Users/administrator/develop/anewhope/infrastructure/certificates/macbook/tfmmyllm.ai.pem;
        ssl_certificate_key /Users/administrator/develop/anewhope/infrastructure/certificates/macbook/tfmmyllm.ai-key.pem;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        # =========================================================
        # FRONTEND PRINCIPAL (Puerto 3100)
        # =========================================================
        location / {
            proxy_pass http://127.0.0.1:3100;
            
            # CRÍTICO: Desactivar buffering para Reflex
            proxy_buffering off;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
        
        # Backend API y WebSocket endpoints
        location /_event {
            proxy_pass http://127.0.0.1:8005;
            
            # CRÍTICO: Desactivar buffering para websockets
            proxy_buffering off; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
        
        location /api {
            proxy_pass http://127.0.0.1:8005;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Backoffice - Redirige a puerto 8443
        location = /backoffice {
            return 302 https://$host:8443/;
        }
        location /backoffice/ {
            return 302 https://$host:8443/;
        }
    }
    
    # Servidor HTTPS para Backoffice (Puerto 8443)
    server {
        listen 0.0.0.0:8443 ssl;
        server_name tfmmyllm.ai *.tfmmyllm.ai 192.168.0.101 192.168.0.39 localhost;
        ssl_certificate /Users/administrator/develop/anewhope/infrastructure/certificates/macbook/tfmmyllm.ai.pem;
        ssl_certificate_key /Users/administrator/develop/anewhope/infrastructure/certificates/macbook/tfmmyllm.ai-key.pem;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        # Backoffice Frontend (Puerto 3200)
        location / {
            proxy_pass http://127.0.0.1:3200;
            proxy_buffering off; # Fix mismatch
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
        
        # Backend API y WebSocket para backoffice
        location /_event {
            proxy_pass http://127.0.0.1:8006;
            proxy_buffering off; # Fix mismatch
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
        
        location /api {
            proxy_pass http://127.0.0.1:8006;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
