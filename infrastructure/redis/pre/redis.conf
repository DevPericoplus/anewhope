# Configuración de Redis para entorno de pre-producción (pre)
# Este archivo debe copiarse a /etc/redis/redis.conf en el servidor pre
# IMPORTANTE: Esta configuración debe ser idéntica a producción para pruebas reales

# ==================== CONEXIÓN Y SEGURIDAD ====================

# Bind a la IP del servidor (ajustar según servidor pre)
# Por seguridad, usar IP específica, NO 0.0.0.0
bind 127.0.0.1 <IP_DEL_SERVIDOR_PRE>

# Puerto por defecto
port 6379

# Modo protegido ACTIVADO (obligatorio)
protected-mode yes

# Password de acceso (debe coincidir con redis_password en protected_values.py del entorno pre)
# IMPORTANTE: Usar password fuerte, diferente a dev
requirepass <PASSWORD_PRE>

# Máximo de clientes conectados simultáneamente
maxclients 500

# Timeout de cliente inactivo (0 = sin timeout)
timeout 300

# TCP keepalive
tcp-keepalive 300

# ==================== DIRECTORIOS Y LOGS ====================

# Directorio de trabajo para archivos de datos
dir /var/lib/redis/

# Archivo de log
logfile /var/log/redis/redis-server.log

# Nivel de log (en pre usar 'notice', no 'debug')
loglevel notice

# Habilitar syslog si se usa sistema de logs centralizado
# syslog-enabled yes
# syslog-ident redis-pre
# syslog-facility local0

# ==================== PERSISTENCIA ====================

# RDB (Snapshots) - Configuración conservadora para pre-producción
save 900 1       # Si al menos 1 key cambió en 900 segundos (15 min)
save 300 10      # Si al menos 10 keys cambiaron en 300 segundos (5 min)
save 60 10000    # Si al menos 10000 keys cambiaron en 60 segundos (1 min)

# Nombre del archivo de snapshot
dbfilename dump.rdb

# Detener escrituras si el último snapshot falló (CRÍTICO)
stop-writes-on-bgsave-error yes

# Comprimir snapshot con LZF
rdbcompression yes

# Verificar checksum del snapshot
rdbchecksum yes

# AOF (Append Only File) - OBLIGATORIO para durabilidad
appendonly yes
appendfilename "appendonly.aof"

# Frecuencia de sincronización del AOF
# everysec: Buen balance entre performance y durabilidad
appendfsync everysec

# No retrasar escrituras durante reescritura de AOF
no-appendfsync-on-rewrite no

# Reescribir AOF automáticamente cuando crezca
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Cargar AOF truncado si está corrupto (último recurso)
aof-load-truncated yes

# ==================== MEMORIA ====================

# Límite de memoria (ajustar según recursos del servidor pre)
# En pre debería ser similar a producción
maxmemory 2gb

# Política de eviction cuando se alcanza maxmemory
# allkeys-lru: Eliminar keys menos usadas recientemente
maxmemory-policy allkeys-lru

# Número de muestras para LRU/LFU
maxmemory-samples 5

# ==================== REPLICACIÓN (OPCIONAL) ====================

# Si hay configuración maestro-replica en pre
# Descomentar y configurar si se usa replicación:

# Si este es un replica:
# replicaof <masterip> <masterport>
# masterauth <master-password>

# El replica es de solo lectura (recomendado)
replica-read-only yes

# Prioridad del replica para promoción (0 = nunca)
replica-priority 100

# ==================== SEGURIDAD ADICIONAL ====================

# Deshabilitar comandos peligrosos en pre-producción
# IMPORTANTE: Descomentar estos para simular producción
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG "CONFIG_PRE_2025"
rename-command SHUTDOWN "SHUTDOWN_PRE_2025"
rename-command KEYS "KEYS_PRE_2025"
rename-command DEBUG ""

# ==================== LÍMITES Y PERFORMANCE ====================

# Límite de clientes conectados
maxclients 500

# Buffer de salida para clientes normales
client-output-buffer-limit normal 0 0 0

# Buffer para replicas
client-output-buffer-limit replica 256mb 64mb 60

# Buffer para pub/sub
client-output-buffer-limit pubsub 32mb 8mb 60

# Frecuencia de servidor (100 = 100Hz, más alto = más responsivo pero más CPU)
hz 10

# ==================== MONITOREO ====================

# Lentitud de comandos (log comandos que tarden más de X microsegundos)
# 10ms = 10000 microsegundos
slowlog-log-slower-than 10000
slowlog-max-len 128

# ==================== TLS/SSL (OPCIONAL) ====================

# Si se requiere conexión cifrada (recomendado para pre y pro):
# port 0
# tls-port 6379
# tls-cert-file /etc/redis/ssl/redis.crt
# tls-key-file /etc/redis/ssl/redis.key
# tls-ca-cert-file /etc/redis/ssl/ca.crt
# tls-auth-clients no

# ==================== CONFIGURACIÓN DE SESIONES ====================

# Nota: Los siguientes parámetros se configuran desde la aplicación,
# no desde este archivo de configuración de Redis

# TTL de sesiones: definido en env.yaml como redis_token_expiration
# Base de datos: definida en env.yaml como redis_db (usar 0)
# Lock expiration: definido en env.yaml como redis_lock_expiration

# ==================== NOTAS DE DESPLIEGUE ====================

# 1. Reemplazar <IP_DEL_SERVIDOR_PRE> con la IP real del servidor
# 2. Reemplazar <PASSWORD_PRE> con el password de protected_values.py del entorno pre
#    IMPORTANTE: Usar password fuerte (16+ caracteres, alfanumérico + símbolos)
# 3. Crear directorios si no existen:
#    sudo mkdir -p /var/lib/redis /var/log/redis
#    sudo chown redis:redis /var/lib/redis /var/log/redis
#    sudo chmod 750 /var/lib/redis /var/log/redis
# 4. Copiar este archivo a: /etc/redis/redis.conf
#    sudo chmod 640 /etc/redis/redis.conf
#    sudo chown redis:redis /etc/redis/redis.conf
# 5. Configurar firewall:
#    sudo ufw allow from <IP_FRONTEND_PRE> to any port 6379
#    sudo ufw allow from <IP_BACKOFFICE_PRE> to any port 6379
# 6. Habilitar y reiniciar servicio:
#    sudo systemctl enable redis-server
#    sudo systemctl restart redis-server
# 7. Verificar logs:
#    sudo tail -f /var/log/redis/redis-server.log
# 8. Verificar conexión:
#    redis-cli -h <IP_DEL_SERVIDOR_PRE> -a <PASSWORD_PRE> ping
# 9. Configurar backup automático de /var/lib/redis/ en cron
# 10. Configurar monitoreo (Prometheus, Grafana, etc.)
