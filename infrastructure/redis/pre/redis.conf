# Configuración de Redis para entorno de pre-producción (pre, contenedor
# docker-compose). El password y bind se ajustan por línea de comandos
# desde docker-compose (--requirepass) — igual que silicon/dev. Este
# contenedor solo es accesible en la red interna de docker
# (frontend-network); el puerto no se expone a internet.
#
# Corregido 2026-09-20 (antes de migrar pre) tras encontrar el mismo bug
# en dev: bind con un placeholder <IP_DEL_SERVIDOR_PRE> sin sustituir
# hacía que Redis fallara al arrancar dentro del contenedor
# ("dependency failed to start"), y logfile a fichero escondía el motivo
# real de "docker logs". Alineado con env/silicon/redis.conf.

# ==================== CONEXIÓN Y SEGURIDAD ====================
# Accesible desde otros contenedores de la red interna de docker-compose.
bind 0.0.0.0
port 6379
# protected-mode off: la red docker interna ya aísla el acceso; el
# password se inyecta con --requirepass desde el compose.
protected-mode no

# Máximo de clientes conectados simultáneamente
maxclients 500

# Timeout de cliente inactivo (0 = sin timeout)
timeout 300

# TCP keepalive
tcp-keepalive 300

# ==================== DIRECTORIOS Y LOGS ====================

# Directorio de trabajo para archivos de datos
dir /var/lib/redis/

# Log a stdout (vacío = stdout) — así "docker logs" muestra los mensajes
# reales de Redis en vez de esconderlos en un fichero del contenedor.
logfile ""

# Nivel de log (en pre usar 'notice', no 'debug')
loglevel notice

# Habilitar syslog si se usa sistema de logs centralizado
# syslog-enabled yes
# syslog-ident redis-pre
# syslog-facility local0

# ==================== PERSISTENCIA ====================

# RDB (Snapshots) - Configuración conservadora para pre-producción: al
# menos 1 key en 900s (15 min), al menos 10 keys en 300s (5 min), al
# menos 10000 keys en 60s (1 min). Redis 8.x no tolera comentarios al
# final de la línea "save" (encontrado 2026-09-20 en dev: "FATAL CONFIG
# FILE ERROR ... Invalid save parameters") — corregido aquí también de
# cara al despliegue de pre.
save 900 1
save 300 10
save 60 10000

# Nombre del archivo de snapshot
dbfilename dump.rdb

# Detener escrituras si el último snapshot falló (CRÍTICO)
stop-writes-on-bgsave-error yes

# Comprimir snapshot con LZF
rdbcompression yes

# Verificar checksum del snapshot
rdbchecksum yes

# AOF (Append Only File) - OBLIGATORIO para durabilidad
appendonly yes
appendfilename "appendonly.aof"

# Frecuencia de sincronización del AOF
# everysec: Buen balance entre performance y durabilidad
appendfsync everysec

# No retrasar escrituras durante reescritura de AOF
no-appendfsync-on-rewrite no

# Reescribir AOF automáticamente cuando crezca
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Cargar AOF truncado si está corrupto (último recurso)
aof-load-truncated yes

# ==================== MEMORIA ====================

# Límite de memoria (ajustar según recursos del servidor pre)
# En pre debería ser similar a producción
maxmemory 2gb

# Política de eviction cuando se alcanza maxmemory
# allkeys-lru: Eliminar keys menos usadas recientemente
maxmemory-policy allkeys-lru

# Número de muestras para LRU/LFU
maxmemory-samples 5

# ==================== REPLICACIÓN (OPCIONAL) ====================

# Si hay configuración maestro-replica en pre
# Descomentar y configurar si se usa replicación:

# Si este es un replica:
# replicaof <masterip> <masterport>
# masterauth <master-password>

# El replica es de solo lectura (recomendado)
replica-read-only yes

# Prioridad del replica para promoción (0 = nunca)
replica-priority 100

# ==================== SEGURIDAD ADICIONAL ====================

# Deshabilitar comandos peligrosos en pre-producción
# IMPORTANTE: Descomentar estos para simular producción
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG "CONFIG_PRE_2025"
rename-command SHUTDOWN "SHUTDOWN_PRE_2025"
rename-command KEYS "KEYS_PRE_2025"
rename-command DEBUG ""

# ==================== LÍMITES Y PERFORMANCE ====================

# Límite de clientes conectados
maxclients 500

# Buffer de salida para clientes normales
client-output-buffer-limit normal 0 0 0

# Buffer para replicas
client-output-buffer-limit replica 256mb 64mb 60

# Buffer para pub/sub
client-output-buffer-limit pubsub 32mb 8mb 60

# Frecuencia de servidor (100 = 100Hz, más alto = más responsivo pero más CPU)
hz 10

# ==================== MONITOREO ====================

# Lentitud de comandos (log comandos que tarden más de X microsegundos)
# 10ms = 10000 microsegundos
slowlog-log-slower-than 10000
slowlog-max-len 128

# ==================== TLS/SSL (OPCIONAL) ====================

# Si se requiere conexión cifrada (recomendado para pre y pro):
# port 0
# tls-port 6379
# tls-cert-file /etc/redis/ssl/redis.crt
# tls-key-file /etc/redis/ssl/redis.key
# tls-ca-cert-file /etc/redis/ssl/ca.crt
# tls-auth-clients no

# ==================== CONFIGURACIÓN DE SESIONES ====================

# Nota: Los siguientes parámetros se configuran desde la aplicación,
# no desde este archivo de configuración de Redis

# TTL de sesiones: definido en env.yaml como redis_token_expiration
# Base de datos: definida en env.yaml como redis_db (usar 0)
# Lock expiration: definido en env.yaml como redis_lock_expiration

# ==================== NOTAS DE DESPLIEGUE ====================
# Contenedor docker-compose (build: Dockerfile en esta misma carpeta) —
# no hay pasos manuales de sistema (sin ufw/systemctl/directorios a
# mano): la imagen se reconstruye y se levanta desde frontend.yml
# --tags docker-compose. Logs: "docker logs redis-pre". Backup: incluir
# el volumen de persistencia de Redis en la estrategia de backup general
# del entorno, no aquí.
