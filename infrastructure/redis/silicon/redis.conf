# Configuración de Redis para entorno silicon (contenedor docker-compose)
# El password y bind se ajustan por línea de comandos desde docker-compose
# (--requirepass). Este contenedor solo es accesible en la red interna de
# docker (frontend-network); el puerto no se expone a internet.

# ==================== CONEXIÓN Y SEGURIDAD ====================
# Accesible desde otros contenedores de la red interna de docker-compose.
bind 0.0.0.0
port 6379
# protected-mode off: la red docker interna ya aísla el acceso; el password
# se inyecta con --requirepass desde el compose.
protected-mode no

maxclients 100
timeout 300

# ==================== DIRECTORIOS Y LOGS ====================
dir /var/lib/redis/
logfile ""
loglevel notice

# ==================== PERSISTENCIA ====================
# RDB (snapshots). Sin comentarios inline (Redis 8 los rechaza en 'save').
# 1 cambio en 900s
save 900 1
# 10 cambios en 300s
save 300 10
# 10000 cambios en 60s
save 60 10000

dbfilename dump.rdb
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# AOF
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ==================== MEMORIA ====================
maxmemory 512mb
maxmemory-policy allkeys-lru

# ==================== MONITOREO ====================
slowlog-log-slower-than 10000
slowlog-max-len 128
