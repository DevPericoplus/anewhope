# Configuración de Redis para entorno de desarrollo (dev)
# Este archivo debe copiarse a /etc/redis/redis.conf en el servidor dev

# ==================== CONEXIÓN Y SEGURIDAD ====================

# Bind a la IP del servidor (ajustar según servidor dev)
# Por seguridad, no usar 0.0.0.0 sino la IP específica del servidor
bind 127.0.0.1 <IP_DEL_SERVIDOR_DEV>

# Puerto por defecto
port 6379

# Modo protegido ACTIVADO (requiere password o bind específico)
protected-mode yes

# Password de acceso (debe coincidir con redis_password en protected_values.py del entorno dev)
# IMPORTANTE: Cambiar este password en el servidor
requirepass <PASSWORD_DEV>

# Máximo de clientes conectados simultáneamente
maxclients 100

# Timeout de cliente inactivo (0 = sin timeout)
timeout 300

# ==================== DIRECTORIOS Y LOGS ====================

# Directorio de trabajo para archivos de datos
dir /var/lib/redis/

# Archivo de log
logfile /var/log/redis/redis-server.log

# Nivel de log (debug, verbose, notice, warning)
loglevel notice

# ==================== PERSISTENCIA ====================

# RDB (Snapshots)
# Guardar snapshot automáticamente según cambios
save 900 1       # Si al menos 1 key cambió en 900 segundos (15 min)
save 300 10      # Si al menos 10 keys cambiaron en 300 segundos (5 min)
save 60 10000    # Si al menos 10000 keys cambiaron en 60 segundos (1 min)

# Nombre del archivo de snapshot
dbfilename dump.rdb

# Detener escrituras si el último snapshot falló
stop-writes-on-bgsave-error yes

# Comprimir snapshot con LZF
rdbcompression yes

# Verificar checksum del snapshot
rdbchecksum yes

# AOF (Append Only File) para mayor durabilidad
appendonly yes
appendfilename "appendonly.aof"

# Frecuencia de sincronización del AOF
# - always: sincronización después de cada escritura (más seguro, más lento)
# - everysec: sincronización cada segundo (buen balance)
# - no: dejar que el SO decida cuándo sincronizar (más rápido, menos seguro)
appendfsync everysec

# No retrasar escrituras durante reescritura de AOF
no-appendfsync-on-rewrite no

# Reescribir AOF automáticamente cuando crezca
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ==================== MEMORIA ====================

# Límite de memoria (ajustar según recursos del servidor dev)
maxmemory 512mb

# Política de eviction cuando se alcanza maxmemory
# allkeys-lru: Eliminar keys menos usadas recientemente (recomendado para cache)
maxmemory-policy allkeys-lru

# ==================== REPLICACIÓN ====================

# Si hay un servidor maestro (dejar comentado si este ES el maestro)
# replicaof <masterip> <masterport>
# masterauth <master-password>

# El replica es de solo lectura (recomendado)
replica-read-only yes

# ==================== SEGURIDAD ADICIONAL ====================

# Deshabilitar comandos peligrosos en entorno compartido
# (Descomentar si múltiples equipos usan el mismo Redis)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""
# rename-command SHUTDOWN ""
# rename-command KEYS ""

# ==================== CONFIGURACIÓN DE SESIONES ====================

# Nota: Los siguientes parámetros se configuran desde la aplicación,
# no desde este archivo de configuración de Redis

# TTL de sesiones: definido en env.yaml como redis_token_expiration
# Base de datos: definida en env.yaml como redis_db (usar 0)
# Lock expiration: definido en env.yaml como redis_lock_expiration

# ==================== MONITOREO ====================

# Lentitud de comandos (log comandos que tarden más de X microsegundos)
slowlog-log-slower-than 10000
slowlog-max-len 128

# ==================== NOTAS DE DESPLIEGUE ====================

# 1. Reemplazar <IP_DEL_SERVIDOR_DEV> con la IP real del servidor
# 2. Reemplazar <PASSWORD_DEV> con el password de protected_values.py del entorno dev
# 3. Crear directorios si no existen:
#    sudo mkdir -p /var/lib/redis /var/log/redis
#    sudo chown redis:redis /var/lib/redis /var/log/redis
# 4. Copiar este archivo a: /etc/redis/redis.conf
# 5. Reiniciar servicio: sudo systemctl restart redis-server
# 6. Verificar logs: sudo tail -f /var/log/redis/redis-server.log
# 7. Actualizar firewall para permitir puerto 6379 solo desde IPs autorizadas
