# Configuración de Redis para entorno dev (contenedor docker-compose)
# El password y bind se ajustan por línea de comandos desde docker-compose
# (--requirepass). Este contenedor solo es accesible en la red interna de
# docker (frontend-network); el puerto no se expone a internet.
#
# Migración a la arquitectura de silicon (2026-09-20): este fichero tenía
# placeholders sin sustituir (<IP_DEL_SERVIDOR_DEV>, <PASSWORD_DEV>) de
# cuando estaba pensado para un despliegue nativo que nunca llegó a
# usarlo — bind con una IP literal inválida hacía que Redis fallara al
# arrancar dentro del contenedor ("dependency failed to start: container
# redis-dev is unhealthy"), y como logfile apuntaba a un fichero dentro
# del contenedor, "docker logs" nunca mostraba el motivo real. Alineado
# con el patrón ya probado de env/silicon/redis.conf.

# ==================== CONEXIÓN Y SEGURIDAD ====================
# Accesible desde otros contenedores de la red interna de docker-compose.
bind 0.0.0.0
port 6379
# protected-mode off: la red docker interna ya aísla el acceso; el
# password se inyecta con --requirepass desde el compose.
protected-mode no

# Máximo de clientes conectados simultáneamente
maxclients 100

# Timeout de cliente inactivo (0 = sin timeout)
timeout 300

# ==================== DIRECTORIOS Y LOGS ====================

# Directorio de trabajo para archivos de datos
dir /var/lib/redis/

# Log a stdout (vacío = stdout) — así "docker logs redis-dev" muestra
# los mensajes reales de Redis; un fichero dentro del contenedor los
# esconde por completo de "docker logs" (encontrado 2026-09-20: el
# bug del bind con IP inválida era invisible en "docker logs" por esto).
logfile ""

# Nivel de log (debug, verbose, notice, warning)
loglevel notice

# ==================== PERSISTENCIA ====================

# RDB (Snapshots)
# Guardar snapshot automáticamente según cambios: al menos 1 key en 900s
# (15 min), al menos 10 keys en 300s (5 min), al menos 10000 keys en 60s
# (1 min). Redis 8.x no tolera comentarios al final de la línea "save"
# (encontrado 2026-09-20 al desplegar dev: "FATAL CONFIG FILE ERROR ...
# Invalid save parameters") — silicon nunca tuvo este bug porque su
# redis.conf nunca llevó el comentario en la misma línea.
save 900 1
save 300 10
save 60 10000

# Nombre del archivo de snapshot
dbfilename dump.rdb

# Detener escrituras si el último snapshot falló
stop-writes-on-bgsave-error yes

# Comprimir snapshot con LZF
rdbcompression yes

# Verificar checksum del snapshot
rdbchecksum yes

# AOF (Append Only File) para mayor durabilidad
appendonly yes
appendfilename "appendonly.aof"

# Frecuencia de sincronización del AOF
# - always: sincronización después de cada escritura (más seguro, más lento)
# - everysec: sincronización cada segundo (buen balance)
# - no: dejar que el SO decida cuándo sincronizar (más rápido, menos seguro)
appendfsync everysec

# No retrasar escrituras durante reescritura de AOF
no-appendfsync-on-rewrite no

# Reescribir AOF automáticamente cuando crezca
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ==================== MEMORIA ====================

# Límite de memoria (ajustar según recursos del servidor dev)
maxmemory 512mb

# Política de eviction cuando se alcanza maxmemory
# allkeys-lru: Eliminar keys menos usadas recientemente (recomendado para cache)
maxmemory-policy allkeys-lru

# ==================== REPLICACIÓN ====================

# Si hay un servidor maestro (dejar comentado si este ES el maestro)
# replicaof <masterip> <masterport>
# masterauth <master-password>

# El replica es de solo lectura (recomendado)
replica-read-only yes

# ==================== SEGURIDAD ADICIONAL ====================

# Deshabilitar comandos peligrosos en entorno compartido
# (Descomentar si múltiples equipos usan el mismo Redis)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""
# rename-command SHUTDOWN ""
# rename-command KEYS ""

# ==================== CONFIGURACIÓN DE SESIONES ====================

# Nota: Los siguientes parámetros se configuran desde la aplicación,
# no desde este archivo de configuración de Redis

# TTL de sesiones: definido en env.yaml como redis_token_expiration
# Base de datos: definida en env.yaml como redis_db (usar 0)
# Lock expiration: definido en env.yaml como redis_lock_expiration

# ==================== MONITOREO ====================

# Lentitud de comandos (log comandos que tarden más de X microsegundos)
slowlog-log-slower-than 10000
slowlog-max-len 128

# ==================== NOTAS DE DESPLIEGUE ====================
# Contenedor docker-compose (build: Dockerfile en esta misma carpeta) —
# no hay pasos manuales: la imagen se reconstruye y se levanta desde
# frontend.yml --tags docker-compose. Logs: "docker logs redis-dev".
# 7. Actualizar firewall para permitir puerto 6379 solo desde IPs autorizadas
