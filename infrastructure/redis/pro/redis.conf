# Configuración de Redis para entorno de producción (pro)
# Este archivo debe copiarse a /etc/redis/redis.conf en el servidor pro
# CRÍTICO: Revisar y ajustar todos los parámetros antes de usar en producción

# ==================== CONEXIÓN Y SEGURIDAD ====================

# Bind a la IP del servidor (NUNCA usar 0.0.0.0 en producción)
# Usar IP específica del servidor de producción
bind 127.0.0.1 <IP_DEL_SERVIDOR_PRO>

# Puerto por defecto
port 6379

# Modo protegido ACTIVADO (OBLIGATORIO en producción)
protected-mode yes

# Password de acceso (debe coincidir con redis_password en protected_values.py del entorno pro)
# CRÍTICO: Usar password fuerte (20+ caracteres, alfanumérico + símbolos)
# Ejemplo: openssl rand -base64 32
requirepass <PASSWORD_PRO>

# Máximo de clientes conectados simultáneamente
# Ajustar según carga esperada
maxclients 10000

# Timeout de cliente inactivo (300 = 5 minutos)
timeout 300

# TCP keepalive (detectar clientes muertos)
tcp-keepalive 300

# TCP backlog (cola de conexiones pendientes)
tcp-backlog 511

# ==================== DIRECTORIOS Y LOGS ====================

# Directorio de trabajo para archivos de datos
# IMPORTANTE: Debe estar en disco con suficiente espacio y IOPS
dir /var/lib/redis/

# Archivo de log
logfile /var/log/redis/redis-server.log

# Nivel de log (en producción usar 'notice', NO 'debug')
loglevel notice

# Habilitar syslog para integración con sistema de logs centralizado
# syslog-enabled yes
# syslog-ident redis-pro
# syslog-facility local0

# ==================== PERSISTENCIA ====================

# RDB (Snapshots) - Configuración conservadora para producción
save 900 1       # Si al menos 1 key cambió en 900 segundos (15 min)
save 300 10      # Si al menos 10 keys cambiaron en 300 segundos (5 min)
save 60 10000    # Si al menos 10000 keys cambiaron en 60 segundos (1 min)

# Nombre del archivo de snapshot
dbfilename dump.rdb

# Detener escrituras si el último snapshot falló (CRÍTICO)
stop-writes-on-bgsave-error yes

# Comprimir snapshot con LZF
rdbcompression yes

# Verificar checksum del snapshot
rdbchecksum yes

# AOF (Append Only File) - OBLIGATORIO para durabilidad en producción
appendonly yes
appendfilename "appendonly.aof"

# Frecuencia de sincronización del AOF
# everysec: Mejor balance entre performance y durabilidad
# Máxima pérdida: 1 segundo de datos
appendfsync everysec

# No retrasar escrituras durante reescritura de AOF
no-appendfsync-on-rewrite no

# Reescribir AOF automáticamente cuando crezca
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Cargar AOF truncado si está corrupto (último recurso)
aof-load-truncated yes

# Usar formato más eficiente para AOF
aof-use-rdb-preamble yes

# ==================== MEMORIA ====================

# Límite de memoria (ajustar según recursos del servidor PRO)
# Dejar margen para overhead del OS y Redis
# Si el servidor tiene 16GB RAM, usar máximo 12GB para Redis
maxmemory 8gb

# Política de eviction cuando se alcanza maxmemory
# allkeys-lru: Eliminar keys menos usadas recientemente
maxmemory-policy allkeys-lru

# Número de muestras para LRU/LFU (más = mejor precisión, más CPU)
maxmemory-samples 5

# ==================== REPLICACIÓN Y ALTA DISPONIBILIDAD ====================

# Si este es un servidor REPLICA (slave):
# Descomentar y configurar:
# replicaof <masterip> <masterport>
# masterauth <master-password>

# El replica es de solo lectura (RECOMENDADO)
replica-read-only yes

# Servir datos antiguos si la replicación está caída
replica-serve-stale-data yes

# Prioridad del replica para promoción (0 = nunca promocionar)
replica-priority 100

# Timeout de replicación
repl-timeout 60

# Deshabilitar TCP_NODELAY en replicación (mejor throughput)
repl-disable-tcp-nodelay no

# Tamaño del backlog de replicación
repl-backlog-size 256mb

# TTL del backlog si no hay replicas conectados
repl-backlog-ttl 3600

# ==================== REDIS SENTINEL (Si se usa) ====================

# Si se usa Redis Sentinel para HA, añadir:
# sentinel monitor mymaster <masterip> <masterport> 2
# sentinel auth-pass mymaster <PASSWORD_PRO>
# sentinel down-after-milliseconds mymaster 5000
# sentinel parallel-syncs mymaster 1
# sentinel failover-timeout mymaster 10000

# ==================== SEGURIDAD ADICIONAL ====================

# DESHABILITAR COMANDOS PELIGROSOS EN PRODUCCIÓN (OBLIGATORIO)
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG "CONFIG_PRO_XYZ_2025"
rename-command SHUTDOWN "SHUTDOWN_PRO_XYZ_2025"
rename-command KEYS "KEYS_PRO_XYZ_2025"
rename-command DEBUG ""
rename-command EVAL "EVAL_PRO_XYZ_2025"
rename-command SCRIPT "SCRIPT_PRO_XYZ_2025"

# Nota: Guardar los nombres renombrados en lugar seguro
# Solo administradores deben conocerlos

# ==================== LÍMITES Y PERFORMANCE ====================

# Límite de clientes conectados
maxclients 10000

# Buffer de salida para clientes normales
# 0 0 0 = sin límite (ajustar si hay problemas de memoria)
client-output-buffer-limit normal 0 0 0

# Buffer para replicas (importante para replicación estable)
client-output-buffer-limit replica 256mb 64mb 60

# Buffer para pub/sub
client-output-buffer-limit pubsub 32mb 8mb 60

# Frecuencia de servidor (100 = 100Hz)
# Más alto = más responsivo pero más CPU
hz 10

# Habilitar latencia baja de I/O
io-threads 4
io-threads-do-reads yes

# ==================== MONITOREO ====================

# Lentitud de comandos (log comandos que tarden más de X microsegundos)
# 10ms = 10000 microsegundos
slowlog-log-slower-than 10000
slowlog-max-len 128

# Habilitar latency monitor
latency-monitor-threshold 100

# ==================== TLS/SSL (RECOMENDADO) ====================

# Habilitar TLS para conexiones cifradas
# IMPORTANTE: Descomentar y configurar certificados en producción

# Deshabilitar puerto sin cifrar
# port 0

# Habilitar puerto TLS
# tls-port 6379
# tls-cert-file /etc/redis/ssl/redis.crt
# tls-key-file /etc/redis/ssl/redis.key
# tls-ca-cert-file /etc/redis/ssl/ca.crt

# Requerir certificados de cliente
# tls-auth-clients yes
# tls-protocols "TLSv1.2 TLSv1.3"
# tls-ciphers DEFAULT:!EXPORT:!LOW:!MEDIUM:!MD5:!aNULL
# tls-prefer-server-ciphers yes

# ==================== ADVANCED CONFIG ====================

# Número de bases de datos (por defecto 16)
databases 16

# Habilitar notificaciones de keyspace events (solo si se necesita)
# notify-keyspace-events ""

# Hash max ziplist (optimización de memoria)
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List max ziplist (optimización de memoria)
list-max-ziplist-size -2
list-compress-depth 0

# Set max intset (optimización de memoria)
set-max-intset-entries 512

# Sorted set max ziplist (optimización de memoria)
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation (optimización de memoria)
hll-sparse-max-bytes 3000

# Rehashing incremental
activerehashing yes

# Límite de memoria del cliente (ajustar si hay muchas consultas grandes)
client-query-buffer-limit 1gb

# Protección contra consultas de rango muy grandes
proto-max-bulk-len 512mb

# ==================== LAZY FREEING ====================

# Liberar memoria de forma asíncrona (reduce latencia)
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# ==================== THREAD I/O ====================

# Número de threads para I/O (ajustar según CPU)
# Dejar en 1 si CPU < 4 cores
io-threads 4
io-threads-do-reads yes

# ==================== CONFIGURACIÓN DE SESIONES ====================

# Nota: Los siguientes parámetros se configuran desde la aplicación,
# no desde este archivo de configuración de Redis

# TTL de sesiones: definido en env.yaml como redis_token_expiration
# Base de datos: definida en env.yaml como redis_db (usar 0)
# Lock expiration: definido en env.yaml como redis_lock_expiration

