# Versions of software used

# Versión global de producto — ver AGENTS.md § Gestión de versiones.
# Solo se cambia manualmente al hacer un release global, con
# scripts/release_global_version.py (nunca a mano, ni en un cambio
# parcial de un solo componente — para eso están las version_* de
# abajo). Cada release global queda fijado, junto con la versión
# exacta de cada componente en ese momento, en releases.yml.
version_global: 1.0.2

# App versions (fuente de verdad para imágenes Docker y despliegue selectivo)
# Manifiesto de paths: infrastructure/docker/service_manifest.yml
# Incrementar con: python scripts/bump_service_version.py <servicio> --level fix|minor|major
version_frontend: 0.8.6
version_backoffice: 0.8.5
version_middleware: 0.8.5
version_broker: 0.8.3
version_backend_core: 0.8.9
version_backend_ia: 0.8.2
version_fmanagement: 0.8.2
version_laimweb: 0.12.10
version_laim_forum: 0.7.7

# Infrastructure versions
python_version: "3.13"
python_trainer_version: "3.12"
go_version: "1.25"
redis_version: "8.4.0"
mariadb_version: "10.6"
nginx_version: "latest"
node_version: "20"
