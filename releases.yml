# Historial de versiones globales de anewhope/LAIM.
#
# Cada entrada fija la versión global liberada, su fecha, y la versión
# EXACTA de cada componente (version_* de versions.yml) en el momento
# del release — una foto congelada, no un puntero a "lo que hubiera en
# versions.yml en ese momento" (versions.yml sigue avanzando después).
#
# Se añade una entrada nueva SOLO al hacer un release global, con
# scripts/release_global_version.py — nunca a mano. Ver AGENTS.md §
# Gestión de versiones.
#
# laim_maintenance lee este fichero para saber, dada una versión
# global, qué versión de cada componente le corresponde — y así poder
# comparar un entorno desplegado frente a un objetivo de versión
# global concreto, no solo frente a "lo último publicado".

releases:
  - version: "1.0.0"
    date: "2026-09-24"
    components:
      version_frontend: "0.8.5"
      version_backoffice: "0.8.4"
      version_middleware: "0.8.4"
      version_broker: "0.8.2"
      version_backend_core: "0.8.8"
      version_backend_ia: "0.8.1"
      version_fmanagement: "0.8.0"
      version_laimweb: "0.12.9"
      version_laim_forum: "0.7.6"
